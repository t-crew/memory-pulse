# Release: push a tag (npm version patch && git push --follow-tags) and this
# workflow publishes to npm and to the MCP registry with NO tokens and NO
# 2FA prompts — both use GitHub's OIDC identity ("trusted publishing").
#
# One-time setup on npmjs.com (package memory-pulse -> Settings -> Trusted
# Publisher -> GitHub Actions): Organization or user "t-crew", Repository
# "memory-pulse", Workflow filename "release.yml", Allowed actions "npm publish".
# After that, npm verifies this workflow's identity and attaches provenance
# automatically (docs.npmjs.com/trusted-publishers, read 2026-08-31).
name: release
on:
  push:
    # Only exact release tags publish. The moving major tag `v0` (what
    # `uses: t-crew/memory-pulse@v0` resolves) must never trigger a publish.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  id-token: write   # OIDC for npm and the MCP registry
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest   # trusted publishing requires GitHub-hosted runners
    steps:
      - uses: actions/checkout@v5
      # No `registry-url:` here on purpose. With it, setup-node writes an
      # .npmrc line `_authToken=${NODE_AUTH_TOKEN}` and exports the placeholder
      # NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX; npm then publishes with that
      # bogus token and never exchanges the GitHub OIDC identity — the registry
      # answers E404 "not found or no permission". Measured on run 33493544779
      # (three attempts, 2026-09-01). With no token configured, npm >= 11.5.1
      # uses the runner's id-token and the Trusted Publisher.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: npm >= 11.5.1 (trusted publishing)
        run: npm install -g npm@latest && npm --version
      - name: tag must match package.json, and every manifest must match package.json
        # server.json (MCP registry), .claude-plugin/plugin.json (Claude Code)
        # and .codex-plugin/plugin.json (Codex) each carry their own version.
        # v0.2.2 was once tagged while two of them still said 0.2.1 — that
        # would have shipped a fresh npm release under stale registry metadata.
        # Refuse to publish anything until they agree (test/manifests.test.js
        # checks the same thing locally).
        run: |
          v="$(node -p 'require("./package.json").version')"
          [ "${GITHUB_REF_NAME}" = "v${v}" ] || { echo "tag ${GITHUB_REF_NAME} != package version v${v}"; exit 1; }
          for f in server.json .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            m="$(node -p "require('./$f').version")"
            [ "$m" = "$v" ] || { echo "$f says $m, package.json says $v"; exit 1; }
          done
          [ "$(node -p 'require("./server.json").packages[0].version')" = "$v" ] || { echo "server.json packages[0].version != $v"; exit 1; }
      - run: npm test
      - name: OIDC diagnostic — the identity this job presents, and the registry's answer (never prints a token)
        run: |
          idt="$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" -H "Accept: application/json" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).value || ""')"
          [ -n "$idt" ] || { echo "no id_token from GitHub — is permissions.id-token: write set?"; exit 0; }
          printf '%s' "$idt" | node -e 'const t=require("fs").readFileSync(0,"utf8").split(".")[1]; const c=JSON.parse(Buffer.from(t,"base64url").toString()); console.log("claims npm matches on:", JSON.stringify({repository:c.repository, repository_owner:c.repository_owner, workflow_ref:c.workflow_ref, job_workflow_ref:c.job_workflow_ref, environment:c.environment??null, ref:c.ref, aud:c.aud}))'
          code="$(curl -sS -o "$RUNNER_TEMP/xchg.json" -w '%{http_code}' -X POST -H "Authorization: Bearer ${idt}" -H "Content-Type: application/json" https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/memory-pulse)"
          if [ "$code" = "200" ] || [ "$code" = "201" ]; then echo "registry exchange OK (${code}) — this workflow identity is a trusted publisher for memory-pulse"; else echo "registry exchange ${code}:"; cat "$RUNNER_TEMP/xchg.json"; echo; fi
      # Both publish steps are idempotent so a re-run (say, after the Trusted
      # Publisher setting was added late) cannot fail on "version already
      # exists" at npm and then never reach the registry.
      - name: publish to npm (OIDC, provenance automatic; skipped if this version is already live)
        run: |
          v="$(node -p 'require("./package.json").version')"
          if npm view "memory-pulse@${v}" version >/dev/null 2>&1; then echo "npm already has ${v} — skipping"; else npm publish --access public; fi
      - name: publish to the MCP registry (OIDC; skipped if this version is already listed)
        run: |
          v="$(node -p 'require("./package.json").version')"
          if curl -sf "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.t-crew/memory-pulse" | grep -q "\"version\":\"${v}\""; then echo "registry already has ${v} — skipping"; exit 0; fi
          curl -sSL -o mp.tgz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          tar xzf mp.tgz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
